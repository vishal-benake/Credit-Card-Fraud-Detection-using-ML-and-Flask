<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card Fraud Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1.5s ease;
    }

    .welcome-box h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .welcome-box p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn-start {
      font-size: 1.1rem;
      padding: 10px 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>🔒 Credit Card Fraud Detection</h1>
    <p>Welcome to our secure prediction system powered by Machine Learning!</p>
    <a href="/predictdata" class="btn btn-light btn-start">🚀 Get Started</a>
  </div>

  <script>
    // Optional greeting animation or console greeting
    console.log("Welcome to the Credit Card Fraud Detection App 🎯");
  </script>
</body>
</html>
