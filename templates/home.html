<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Credit Card Fraud Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-section {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .title {
      text-align: center;
      margin-bottom: 2rem;
    }
    .modal-body p {
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container py-5">
  {% if prediction_text %}
  <div class="alert alert-info text-center fs-5">
    {{ prediction_text }}
  </div>
  {% endif %}

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="form-section">
        <h2 class="title">Credit Card Fraud Detection</h2>

        <form method="POST" action="/predictdata" id="fraudForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Time</label>
              <input type="number" step="0.01" class="form-control" name="Time" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" name="Amount" required />
            </div>

            {% for i in range(1, 29) %}
            <div class="col-md-4">
              <label class="form-label">V{{ i }}</label>
              <input type="number" step="0.0001" class="form-control" name="V{{ i }}" required />
            </div>
            {% endfor %}
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Predict</button>
          </div>
        </form>

        {% if prediction_text %}
        <!-- Modal -->
        <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="resultModalLabel">Prediction Result</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body text-center">
                <p class="fs-5">{{ prediction_text }}</p>
                <a href="/report" class="btn btn-outline-primary">🔍 View Prediction Insights</a>
              </div>
            </div>
          </div>
        </div>
        {% endif %}

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% if prediction_text %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const resultModal = new bootstrap.Modal(document.getElementById('resultModal'));
    resultModal.show();

    document.getElementById('resultModal').addEventListener('hidden.bs.modal', () => {
      document.getElementById('fraudForm').reset();
    });
  });
</script>
{% endif %}

</body>
</html>
