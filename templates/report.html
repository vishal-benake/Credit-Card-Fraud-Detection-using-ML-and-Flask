<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fraud Prediction Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 2rem;
    }
    .card {
      margin-bottom: 2rem;
    }
    .chart-container {
      max-width: 500px;
      margin: 0 auto;
    }
    table th, table td {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">Credit Card Fraud Detection Report</h2>

    <!-- Prediction Summary -->
    <div class="alert alert-info text-center">
      <strong>Prediction:</strong> {{ prediction_text }}
    </div>

    <!-- Fraud Probability Doughnut Chart -->
    <div class="card shadow p-3">
      <h5 class="card-title text-center">Fraud Probability</h5>
      <div class="chart-container">
        <canvas id="fraudChart"></canvas>
      </div>
    </div>

    <!-- Input Summary Table -->
    <div class="card shadow p-3">
      <h5 class="card-title mb-3">Transaction Input Summary</h5>
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead class="table-light">
            <tr>
              <th>Feature</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            {% for key, value in user_input.items() %}
              <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Feature Value Chart -->
    <div class="card shadow p-3">
      <h5 class="card-title text-center">Transaction Feature Values</h5>
      <div class="chart-container">
        <canvas id="featuresChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const userInput = JSON.parse(`{{ user_input | tojson | safe }}`);
    const fraudProbabilities = JSON.parse(`{{ {'not_fraud': not_fraud_prob, 'fraud': fraud_prob} | tojson | safe }}`);

    // Doughnut chart for fraud probability
    const fraudCtx = document.getElementById('fraudChart').getContext('2d');
    new Chart(fraudCtx, {
      type: 'doughnut',
      data: {
        labels: ['Legitimate', 'Fraudulent'],
        datasets: [{
          data: [fraudProbabilities.not_fraud, fraudProbabilities.fraud],
          backgroundColor: ['#36a2eb', '#ff6384']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' }
        }
      }
    });

    // Bar chart for feature values
    const labels = Object.keys(userInput);
    const values = labels.map(k => parseFloat(userInput[k]) || 0);

    const featuresCtx = document.getElementById('featuresChart').getContext('2d');
    new Chart(featuresCtx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Feature Value',
          data: values,
          backgroundColor: '#4bc0c0'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>
</body>
</html>
